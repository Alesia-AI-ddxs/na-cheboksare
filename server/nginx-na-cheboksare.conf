# nginx для веб-версии «На Чебоксаре» (PWA). Пример — замените домен и пути на свои.
# Куда положить: /etc/nginx/sites-available/na-cheboksare.conf и ссылка в sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/na-cheboksare.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (обязателен для установки на iPhone и работы без интернета): sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d example.ru
#
# Сайт — обычные готовые файлы (статический экспорт), сервер ничего не «считает».
# Две схемы:
#   А) приложение в корне домена:        bash server/deploy_web.sh / /var/www/na-cheboksare
#   Б) приложение по адресу /turizm/app/: bash server/deploy_web.sh /turizm/app /var/www/turizm/turizm/app

# .webmanifest — правильный тип файла (в стандартном mime.types его может не быть)
types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    server_name example.ru;            # ← ваш домен

    # ---------- Схема А: приложение в корне ----------
    root /var/www/na-cheboksare;
    index index.html;
    charset utf-8;

    # сжатие текста (gzip есть всегда)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/ttf;
    # brotli — только если установлен модуль (Ubuntu: sudo apt install libnginx-mod-http-brotli-filter
    # libnginx-mod-http-brotli-static), затем уберите # в двух строках ниже:
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    # скрипты и картинки с хэшем в имени никогда не меняются — кэш на год
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # эти файлы должны обновляться сразу — без кэша
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # страницы: /route → route.html, /point/3 → point/3.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /+not-found.html;

    # ---------- Схема Б: приложение по адресу /turizm/app/ ----------
    # Файлы лежат в папке, повторяющей адрес: /var/www/turizm/turizm/app/
    # (выкладка: sudo bash server/deploy_web.sh /turizm/app /var/www/turizm/turizm/app)
    # Можно держать одновременно со схемой А — папки разные, друг другу не мешают.
    location = /turizm/app {
        return 301 /turizm/app/;
    }
    location /turizm/app/ {
        root /var/www/turizm;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /turizm/app/+not-found.html;

        location /turizm/app/_expo/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location /turizm/app/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /turizm/app/sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location = /turizm/app/manifest.webmanifest {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
    }
}
