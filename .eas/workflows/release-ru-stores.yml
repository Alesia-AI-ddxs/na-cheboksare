# Выпуск «На Чебоксаре» в российские магазины: RuStore и/или Huawei AppGallery.
# Запуск вручную:
#   npx eas workflow:run .eas/workflows/release-ru-stores.yml -F stores=rustore -F submit=no
#   (или npm run eas:release-ru — тогда EAS спросит магазины и «отправлять ли на модерацию»)
# Шаг 1 собирает APK (профиль production-apk) в облаке EAS.
# Шаг 2 скачивает этот APK и запускает наши скрипты публикации:
#   scripts/rustore-publish.mjs и/или scripts/appgallery-publish.mjs
# submit=no — только черновик в консоли магазина (безопасно); submit=yes — сразу на модерацию.
# Ключи берутся из переменных EAS (expo.dev → проект → Environment variables, среда production):
#   RUSTORE_KEY_ID, RUSTORE_PRIVATE_KEY, AGC_CLIENT_ID, AGC_CLIENT_SECRET, AGC_APP_ID (тип Secret).
name: Release RU stores

on:
  workflow_dispatch:
    inputs:
      stores:
        description: "Куда выпускать: rustore | appgallery | rustore+appgallery"
        type: choice
        options:
          - rustore
          - appgallery
          - rustore+appgallery
        default: rustore
      submit:
        description: "Отправить на модерацию сразу? no — только черновик, yes — на модерацию"
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

jobs:
  build_android_apk:
    name: Сборка APK (production-apk)
    type: build
    params:
      platform: android
      profile: production-apk

  publish_rustore:
    name: Публикация в RuStore
    needs: [build_android_apk]
    if: ${{ contains(inputs.stores || 'rustore', 'rustore') }}
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download
        with:
          build_id: ${{ needs.build_android_apk.outputs.build_id }}
          extensions: [apk]
      - name: Загрузка в RuStore
        run: node scripts/rustore-publish.mjs --file "${{ steps.download.outputs.artifact_path }}" --submit "${{ inputs.submit || 'no' }}"

  publish_appgallery:
    name: Публикация в AppGallery
    needs: [build_android_apk]
    if: ${{ contains(inputs.stores || 'rustore', 'appgallery') }}
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download
        with:
          build_id: ${{ needs.build_android_apk.outputs.build_id }}
          extensions: [apk]
      - name: Загрузка в AppGallery
        run: node scripts/appgallery-publish.mjs --file "${{ steps.download.outputs.artifact_path }}" --submit "${{ inputs.submit || 'no' }}"
